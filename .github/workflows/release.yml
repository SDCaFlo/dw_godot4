# Distribution step D8 (specs/release_ci.md): on a version tag (v0.1.0), build the Windows export and
# dw_convert.exe, run the checks that need no game content, package the zip (release/package.py,
# which refuses game content) and attach it to a draft release. Run by hand (workflow_dispatch) it
# builds the zip as a short-lived artifact instead, without a release.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  PYTHON_VERSION: "3.13"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(python -c "import json; print(json.load(open('version.json'))['game'])")"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Godot and only the Windows release template (the full .tpz is about 1 GB), cached.
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .ci/godot
          key: godot-${{ env.GODOT_VERSION }}-win64-templates
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p .ci/godot && cd .ci/godot
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz templates/windows_release_x86_64.exe templates/version.txt && rm templates.tpz
      - name: Install Godot
        run: |
          dest="$APPDATA/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && cp .ci/godot/templates/* "$dest/"
          echo "GODOT=$(ls "$PWD"/.ci/godot/Godot_v*_win64_console.exe)" >> "$GITHUB_ENV"

      - name: Import the project
        run: timeout 600 "$GODOT" --headless --path . --import || true

      # The checks that run without game content.
      - name: Godot tests (no content needed)
        run: |
          for t in test_rules test_release test_launcher; do
            out="$(timeout 300 "$GODOT" --headless --path . -s "res://tests/$t.gd" 2>&1)"; echo "$out" | tail -3
            echo "$out" | grep -qE "^OK" || { echo "::error::$t failed"; exit 1; }
          done
      - name: dw_convert tests (synthetic images)
        working-directory: dw_convert
        run: python -m unittest discover -s tests -t .

      - name: Export the game
        run: |
          mkdir -p build/windows
          timeout 900 "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/dw_godot4.exe
          ls -la build/windows
      - name: Build dw_convert.exe
        working-directory: dw_convert
        run: python build_exe.py

      - name: Package
        run: python release/package.py "${{ steps.version.outputs.version }}"

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: dw_godot4 ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/dw_godot4-${{ steps.version.outputs.version }}-windows.zip
      - name: Artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dw_godot4-${{ steps.version.outputs.version }}-windows
          path: build/dw_godot4-${{ steps.version.outputs.version }}-windows.zip
          retention-days: 3
